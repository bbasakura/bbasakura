<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="100%" height="100%">
  <title>OpenCodex Quota Showcase Card</title>
  <defs>
    <linearGradient id="ocx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ocx-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="576" height="196" rx="14" fill="url(#ocx-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="20" y="20" width="4" height="160" rx="2" fill="url(#ocx-accent)"/>
  
  <g transform="translate(36, 24)">
