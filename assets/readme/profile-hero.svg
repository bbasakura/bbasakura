<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>bbasakura Developer Profile Banner</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Grid Lines -->
  <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360" stroke="#1E293B" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <path d="M 200,0 L 200,420 M 400,0 L 400,420 M 600,0 L 600,420 M 800,0 L 800,420 M 1000,0 L 1000,420" stroke="#1E293B" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Left Accent Bar -->
  <rect x="40" y="48" width="6" height="324" rx="3" fill="url(#primary-glow)"/>

  <!-- Header Title -->
  <g transform="translate(64, 50)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#10B981" filter="url(#glow)"/>
    <text x="26" y="18" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">BUILDING &amp; EXPLORING</text>

    <text x="0" y="75" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">bbasakura</text>
    <text x="0" y="112" fill="url(#primary-glow)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">Full-Stack Engineer · AI Agent &amp; Desktop Tools Specialist</text>

    <text x="0" y="148" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">Passionate about building high-performance desktop utilities, AI agent automations,</text>
    <text x="0" y="172" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">data algorithms, and modern developer tools with clean architecture.</text>

    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="160" height="54" rx="10" fill="url(#card-grad)" stroke="#334155"/>
      <text x="16" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">FOCUS</text>
      <text x="16" y="42" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">AI &amp; Native Apps</text>

      <rect x="172" y="0" width="160" height="54" rx="10" fill="url(#card-grad)" stroke="#334155"/>
      <text x="188" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">MAIN STACK</text>
      <text x="188" y="42" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Python · Java · C#</text>

      <rect x="344" y="0" width="160" height="54" rx="10" fill="url(#card-grad)" stroke="#334155"/>
      <text x="360" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">SYSTEM OS</text>
      <text x="360" y="42" fill="#A855F7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Windows &amp; Linux</text>
    </g>
  </g>

  <!-- Right Visual Window Mockup -->
  <g transform="translate(690, 48)">
    <rect x="0" y="0" width="470" height="324" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="470" height="36" rx="12" fill="#1E293B"/>
    <path d="M 0,24 L 0,36 L 470,36 L 470,24 Z" fill="#1E293B"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="235" y="23" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">bbasakura@dev-environment ~</text>

    <g transform="translate(20, 52)">
      <text x="0" y="20" fill="#38BDF8" font-family="monospace" font-size="13">$ codex status --user bbasakura</text>
      <text x="0" y="44" fill="#10B981" font-family="monospace" font-size="12">✔ Core Engine: Active</text>
      <text x="0" y="64" fill="#E2E8F0" font-family="monospace" font-size="12">├─ Projects: Tuzi Balance Widget, Codex Bot</text>
      <text x="0" y="84" fill="#E2E8F0" font-family="monospace" font-size="12">├─ Security: DPAPI Encrypted Storage</text>
      <text x="0" y="104" fill="#E2E8F0" font-family="monospace" font-size="12">├─ Architecture: Clean &amp; Modular</text>
      <text x="0" y="124" fill="#E2E8F0" font-family="monospace" font-size="12">└─ Status: Building modern AI tools...</text>
      
      <text x="0" y="156" fill="#A855F7" font-family="monospace" font-size="13">$ python -m tuzi_widget.launch</text>
      <text x="0" y="180" fill="#F59E0B" font-family="monospace" font-size="12">[INFO] Floating Widget Initialized [API Quota: OK]</text>
      <text x="0" y="200" fill="#94A3B8" font-family="monospace" font-size="12">[SYS] Listening for key updates &amp; balance telemetry...</text>

      <rect x="0" y="222" width="10" height="18" fill="#38BDF8" opacity="0.8"/>
      <text x="16" y="236" fill="#64748B" font-family="monospace" font-size="12">Ready for next deployment</text>
    </g>
  </g>
</svg>