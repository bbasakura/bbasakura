<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="100%" height="100%">
  <title>Tuzi Balance Widget Showcase Card</title>
  <defs>
    <linearGradient id="tuzi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tuzi-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="576" height="196" rx="14" fill="url(#tuzi-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="20" y="20" width="4" height="160" rx="2" fill="url(#tuzi-accent)"/>
  
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="110" height="22" rx="4" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.5"/>
    <text x="55" y="15" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WINDOWS NATIVE</text>
    
    <text x="0" y="48" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Tuzi Balance Widget (兔子余额)</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Multi-Key API Quota &amp; Refill Floating Monitor</text>

    <text x="0" y="98" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Built with PySide6 / Custom Tkinter &amp; Python 3.10+</text>
    <text x="0" y="116" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Secure storage via Windows DPAPI local key encryption</text>
    <text x="0" y="134" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Real-time auto-refresh, dark/light theme &amp; masked keys</text>

    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="64" height="20" rx="4" fill="#1E293B" stroke="#475569"/>
      <text x="32" y="14" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Python</text>
      
      <rect x="72" y="0" width="68" height="20" rx="4" fill="#1E293B" stroke="#475569"/>
      <text x="106" y="14" fill="#A855F7" font-family="monospace" font-size="10" text-anchor="middle">PySide6</text>

      <rect x="148" y="0" width="60" height="20" rx="4" fill="#1E293B" stroke="#475569"/>
      <text x="178" y="14" fill="#10B981" font-family="monospace" font-size="10" text-anchor="middle">DPAPI</text>
    </g>
