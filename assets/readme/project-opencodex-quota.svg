    <text x="62" y="15" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI INFRASTRUCTURE</text>
    
    <text x="0" y="48" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="800">OpenCodex Quota Monitor</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Multi-Account Token &amp; Model Quota Telemetry</text>

    <text x="0" y="98" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Cross-platform OpenAI &amp; Antigravity account quota analytics</text>
    <text x="0" y="116" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Real-time model usage tracking &amp; auto account switcher</text>
